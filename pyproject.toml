[project]
name = "padam-nocturne"
version = "0.2.1"
description = "Persistent memory for AI agents with sleep-style consolidation (NOCTURNE) and a verifiable eternal layer on Arweave + Solana"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Maksim Galatin", email = "contact@codeofdigitaleternity.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ai-agents", "memory", "llm", "sqlite", "arweave", "solana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "requests>=2.28", "cryptography>=42"]

[project.optional-dependencies]
l3 = ["solders>=0.20"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://aifa.works"
Repository = "https://github.com/MaksimGalatin/padam-nocturne"
Issues = "https://github.com/MaksimGalatin/padam-nocturne/issues"
Changelog = "https://github.com/MaksimGalatin/padam-nocturne/blob/main/CHANGELOG.md"

[project.scripts]
padam = "padam.cli:main"
padam-mcp = "padam.mcp_server:main"
padam-nocturne = "padam.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padam"]

[tool.setuptools.package-data]
padam = ["turbo_upload.mjs"]
