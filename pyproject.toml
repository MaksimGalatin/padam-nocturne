[project]
name = "padam-nocturne"
version = "0.4.13"
description = "Persistent memory for AI agents with sleep-style consolidation (NOCTURNE) and a verifiable eternal layer on Arweave + Solana"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Maksim Galatin", email = "contact@codeofdigitaleternity.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ai-agents", "memory", "llm", "sqlite", "arweave", "solana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "requests>=2.33.0", "cryptography>=50.0.0"]

[project.optional-dependencies]
l3 = ["solders>=0.20", "opentimestamps>=0.4.5"]
embed = ["model2vec>=0.10"]
guard = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy"]
test = ["pytest>=9.0.3"]

[project.urls]
Homepage = "https://aifa.works"
Repository = "https://github.com/MaksimGalatin/padam-nocturne"
Issues = "https://github.com/MaksimGalatin/padam-nocturne/issues"
Changelog = "https://github.com/MaksimGalatin/padam-nocturne/blob/main/CHANGELOG.md"

[project.scripts]
padam = "padam.cli:main"
padam-mcp = "padam.mcp_server:main"
padam-nocturne = "padam.mcp_server:main"

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padam"]

[tool.setuptools.package-data]
padam = ["turbo_upload.mjs"]
