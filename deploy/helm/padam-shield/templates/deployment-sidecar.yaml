apiVersion: apps/v1
kind: Deployment
metadata:
  name: padam-shield-sidecar
  labels:
    app.kubernetes.io/name: padam-shield
    app.kubernetes.io/version: "0.9.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: padam-shield
  template:
    metadata:
      labels:
        app.kubernetes.io/name: padam-shield
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: padam-mcp-proxy
          image: ghcr.io/codeofdigitaleternity/padam-shield:0.9.1
          imagePullPolicy: IfNotPresent
          args:
            - "shield"
            - "http-proxy"
            - "--listen"
            - "0.0.0.0:9895"
            - "--upstream"
            - "http://127.0.0.1:8080/mcp"
          ports:
            - name: mcp-shield
              containerPort: 9895
              protocol: TCP
          env:
            - name: PADAM_SHIELD_ZERO_TELEMETRY
              value: "1"
            - name: PADAM_SHIELD_MODE
              value: "enforce"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: policy-bundle
              mountPath: /etc/padam-shield
              readOnly: true
            - name: tmp-runtime
              mountPath: /tmp
      volumes:
        - name: policy-bundle
          configMap:
            name: padam-shield-policy
        - name: tmp-runtime
          emptyDir:
            sizeLimit: 64Mi
