# Публикация пакета padam-nocturne на PyPI через доверенного издателя (Trusted Publishing, OIDC) — 12.10.2026.
# Токенов и паролей нет: PyPI доверяет ИМЕННО этому файлу этого репозитория. Запуск — выпуск релиза на GitHub
# или вручную (workflow_dispatch). Издатель заводится на pypi.org: owner MaksimGalatin, repo padam-nocturne,
# workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1