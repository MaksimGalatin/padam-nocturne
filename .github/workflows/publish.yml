# Публикация пакета padam-nocturne на PyPI через доверенного издателя (Trusted Publishing, OIDC) — 12.10.2026.
# Токенов и паролей нет: PyPI доверяет ИМЕННО этому файлу этого репозитория. Запуск — выпуск релиза на GitHub
# или вручную (workflow_dispatch). Издатель заводится на pypi.org: owner MaksimGalatin, repo padam-nocturne,
# workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1