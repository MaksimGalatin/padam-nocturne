name: android-build
# Сборка Android без подписи на каждое изменение android/ и padam/ (23.11.2026).
# Повод: код Android 0.8.0 ушёл в main несобираемым (MainActivity звала несуществующий syncLanWithPc),
# и это всплыло только при ручной сборке APK к выпуску. Подпись релиза здесь не нужна и не используется.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "padam/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "padam/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"   # Chaquopy в app/build.gradle.kts собирает Python 3.11
      - name: Build debug APK (без подписи)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain
      - name: Size of the built APK
        working-directory: android
        run: ls -la app/build/outputs/apk/debug/
