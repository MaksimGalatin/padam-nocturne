name: guard-fixture

# Controlled fixture for the HOL Guard entry mcp.padam-nocturne.
# Prepares HOL Guard at a pinned commit exactly as its own CI does (uv environment, trust bindings,
# native command compiler and runtime, public extension directory), then runs Guard's own MCP
# contribution checks together with our fixture tests_guard/guard_fixture_padam_nocturne.py.
# Guard's code runs here, on GitHub's runner — never on a maintainer machine.

on:
  workflow_dispatch:
  push:
    paths:
      - "tests_guard/**"
      - ".github/workflows/guard-fixture.yml"

permissions:
  contents: read

env:
  HOL_GUARD_REF: adb0437213280cce60458c1f0da8600b60830009

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hashgraph-online/hol-guard
          ref: ${{ env.HOL_GUARD_REF }}
          path: hol-guard
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv>=0.5"
      - name: "Guard environment, as Guard's CI does (uv sync --frozen --no-dev --group ci-test)"
        working-directory: hol-guard
        run: uv sync --frozen --no-dev --group ci-test --python 3.12
      - name: Trust bindings
        working-directory: hol-guard
        run: uv run --no-sync python scripts/refresh_extension_artifacts.py --trust-only
      - name: Native command compiler and runtime (as Guard's CI)
        working-directory: hol-guard
        run: >
          cargo build --manifest-path rust/Cargo.toml --locked --release
          -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
      - name: Generated native command catalogs (as Guard's CI)
        working-directory: hol-guard
        run: uv run --no-sync python scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
      - name: Public extension directory (as Guard's CI)
        working-directory: hol-guard
        env:
          HOL_GUARD_NATIVE: force
        run: |
          export HOL_GUARD_NATIVE_BINARY="$PWD/rust/target/release/hol-guard-runtime"
          uv run --no-sync python scripts/prepare_extension_directory.py --compiler rust/target/release/guard-command-source --write-and-check
      - run: cp tests_guard/guard_fixture_padam_nocturne.py hol-guard/tests/test_guard_mcp_padam_nocturne.py
      - name: HOL Guard contribution checks + PADAM NOCTURNE fixture
        working-directory: hol-guard
        run: |
          export HOL_GUARD_NATIVE_BINARY="$PWD/rust/target/release/hol-guard-runtime"
          uv run --no-sync pytest -q -p no:cacheprovider tests/test_guard_mcp_padam_nocturne.py tests/test_guard_mcp_server_contribution.py
