name: tests
on: [push, pull_request]
# Токен Actions — только чтение (17.10.2026, аудит цепочки поставки).
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test,l3]"
      - run: python -m pytest tests/ -q

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and verify extension archives
        run: python scripts/build_extensions.py --out-dir /tmp/ext-dist --json
      - name: Lint Firefox extension with web-ext
        run: npx --yes web-ext@10.8.0 lint --source-dir extensions/firefox

  restore-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime package
        run: pip install -e .
      - name: Verify demo restore roundtrip (export -> empty import -> diff + backup SHA-256)
        run: python scripts/ci_restore_check.py --json

  mcp-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime package
        run: pip install -e .
      - name: Run MCP protocol audit (stdio + Streamable HTTP + SSE)
        run: python scripts/mcp_protocol_check.py
      - name: Run MCP quality & Web3 sovereignty benchmark
        run: python benchmarks/quality/mcp_quality_bench.py --strict --json

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Studio runtime, Playwright and axe-core
        run: |
          pip install -e . playwright
          playwright install chromium
          npm install --no-save --prefix /tmp/axe axe-core@4.14.0
      - name: Verify Studio accessibility (14 tabs x 2 themes + quick-add modal, 0 serious/critical)
        run: python scripts/studio_a11y_check.py --axe-js /tmp/axe/node_modules/axe-core/axe.min.js

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pip-audit and cyclonedx-bom
        run: pip install pip-audit cyclonedx-bom
      - name: Audit pinned dependencies (requirements.lock)
        run: pip-audit -r requirements.lock --strict --desc
      - name: Verify CycloneDX SBOM generation
        run: |
          cyclonedx-py requirements requirements.lock --of JSON -o /tmp/padam-nocturne.cdx.json
          python -c "import json; d = json.load(open('/tmp/padam-nocturne.cdx.json', encoding='utf-8')); assert d.get('bomFormat') == 'CycloneDX' and len(d.get('components', [])) >= 9, d"

  mcp-inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime package
        run: pip install -e .
      - name: Verify all 8 MCP client configs via stdio
        run: python scripts/check_integrations.py --json
      - name: Verify MCP server via official MCP Inspector (stdio + streamable-http, --strict)
        run: python scripts/mcp_inspector_check.py --package @modelcontextprotocol/inspector@2.13.0 --json
