# Публикация PADAM NOCTURNE в официальный реестр MCP (10.11.2026, поручение Архитектора).
# Вход через OIDC GitHub Actions: без пароля, без личного токена, без ключа в секретах репозитория.
# Три числа (раздел 24): запускается только вручную; цена 0 (публичный репозиторий); сам по себе — 0 раз в сутки.
name: mcp-registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher 1.8.8 (checksum from the release's checksums file)
        run: |
          curl -sSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          echo "09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: server.json passes the registry validator
        run: ./mcp-publisher validate
      - name: Log in with GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
