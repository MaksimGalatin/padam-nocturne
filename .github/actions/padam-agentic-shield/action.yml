name: "PADAM Agentic Shield — Supply-Chain, SRI/CSP & MCP Audit"
description: "Checks web build/HTML/URL for missing SRI, weak CSP, PCI DSS 4.0.1 (6.4.3/11.6.1), skimmers & MCP tool poisoning ($0 local)."
author: "CODE Eternal LLC (Maksim Galatin)"
branding:
  icon: "shield"
  color: "blue"

inputs:
  url:
    description: "Public URL to audit (optional if html-path is given)"
    required: false
    default: ""
  html-path:
    description: "Path to built HTML file (e.g. dist/index.html) for offline SRI/CSP audit"
    required: false
    default: ""
  mcp-config:
    description: "Optional path to mcp.json / .mcp.json to scan for plaintext secrets or tool poisoning"
    required: false
    default: ""
  min-grade:
    description: "Minimum allowed Supply-Chain grade (S, A, B, C, D, F)"
    required: false
    default: "B"
  sarif-out:
    description: "Output SARIF 2.1.0 filename for GitHub Code Scanning"
    required: false
    default: "padam-agentic-shield.sarif"
  html-out:
    description: "Output standalone HTML checkup report filename"
    required: false
    default: "padam-supply-chain-checkup.html"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  package-spec:
    description: "Optional padam-nocturne pip spec (default: padam-nocturne>=0.6.5)"
    required: false
    default: "padam-nocturne>=0.6.5"

outputs:
  grade:
    description: "Supply-Chain grade (S..F)"
    value: ${{ steps.scan.outputs.grade }}
  score:
    description: "Numeric score 0..100"
    value: ${{ steps.scan.outputs.score }}
  sarif-file:
    description: "Generated SARIF file path"
    value: ${{ steps.scan.outputs.sarif_file }}
  html-file:
    description: "Generated HTML checkup path"
    value: ${{ steps.scan.outputs.html_file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install PADAM Agentic Shield
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ github.action_path }}/../../../pyproject.toml" ]; then
          python -m pip install -e "${{ github.action_path }}/../../.."
        else
          python -m pip install "${{ inputs.package-spec }}"
        fi

    - name: Run PADAM Agentic Shield CI Check
      id: scan
      shell: bash
      run: |
        ARGS=(--min-grade "${{ inputs.min-grade }}" --sarif-out "${{ inputs.sarif-out }}" --html-out "${{ inputs.html-out }}")
        if [ -n "${{ inputs.url }}" ]; then
          ARGS+=(--url "${{ inputs.url }}")
        fi
        if [ -n "${{ inputs.html-path }}" ]; then
          ARGS+=(--html-path "${{ inputs.html-path }}")
        fi
        if [ -n "${{ inputs.mcp-config }}" ]; then
          ARGS+=(--mcp-config "${{ inputs.mcp-config }}")
        fi
        python -X utf8 "${{ github.action_path }}/run_action.py" "${ARGS[@]}"
